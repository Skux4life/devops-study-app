[project]
name = "study-tracker-backend"
version = "0.0.0"
description = "Backend API for tracking study time related to DevOps."
readme = "README.md"
authors = [{ name = "Skux4life", email = "skux@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["fastapi>=0.162.2", "httpx>=0.28.1", "uvicorn>=0.54.0"]

[project.scripts]
study-tracker-api = "backend.main:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ASYNC230", "TRY002"]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.4",
]
