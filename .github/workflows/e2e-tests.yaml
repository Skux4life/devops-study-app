name: E2E Tests

on:
  pull_request:

jobs:
  e2e_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kubernetes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mise
        uses: jdx/mise-action@v5

      - name: Run tests
        run: |
          mise run e2e-test
